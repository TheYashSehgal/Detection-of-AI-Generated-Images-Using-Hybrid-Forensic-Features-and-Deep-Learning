version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-detector-backend
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - ./backend/checkpoints:/app/checkpoints
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-detector-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
