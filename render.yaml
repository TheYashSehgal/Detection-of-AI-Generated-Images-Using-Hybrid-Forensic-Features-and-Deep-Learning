services:
  # Backend API
  - type: web
    name: ai-detector-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DEVICE
        value: cpu
      - key: CORS_ORIGINS
        value: https://ai-detector-frontend.onrender.com,http://localhost:5173

  # Frontend (static site)
  - type: web
    name: ai-detector-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-detector-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
